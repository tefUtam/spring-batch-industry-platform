spring:
  application:
    name: spring-batch-industry-platform
  datasource:
    url: jdbc:h2:mem:batch-platform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jobs:
    finance:
      input: file:./samples/finance-transactions.csv
      output: file:./build/finance-screened.csv
      chunk-size: 50
    healthcare:
      input: file:./samples/healthcare-claims.csv
      output: file:./build/healthcare-prioritized.csv
      chunk-size: 50
